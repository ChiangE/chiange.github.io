name: Get Citation Data

on:
  # Refresh after every GitHub Pages build of the site.
  page_build:
  # Daily refresh (08:00 UTC).
  schedule:
    - cron: '0 8 * * *'
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Required so the job can push the refreshed data to the google-scholar-stats branch.
permissions:
  contents: write

concurrency:
  group: get-citation-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter: the runner image's system Python changes over time and
      # may refuse `pip install` into the system environment (PEP 668).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install Reqs
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      # Google Scholar answers GitHub runner IPs with 403/429/CAPTCHA often enough
      # that a failing widget scrape should not turn the whole run red. main.py
      # bounds every attempt with a hard timeout, so this step cannot spin for
      # ~35 minutes the way the old one did.
      - name: Fetch citation data
        id: crawl
        continue-on-error: true
        timeout-minutes: 10
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          cd google_scholar_crawler
          python main.py

      - name: Push results to google-scholar-stats
        if: steps.crawl.outcome == 'success'
        env:
          REMOTE_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd google_scholar_crawler/results
          git init -q -b google-scholar-stats
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add '*.json'
          if git diff --cached --quiet; then
            echo "Citation data unchanged, nothing to push."
            exit 0
          fi
          git commit -q -m "Updated Citation Data"
          git push --quiet --force "${REMOTE_REPO}" HEAD:google-scholar-stats

      - name: Report skipped update
        if: steps.crawl.outcome != 'success'
        run: |
          echo "::warning::Google Scholar did not return data (runner IPs are frequently blocked with 403/429 or a CAPTCHA). The previously published citation data was left untouched and the next scheduled run will try again."
